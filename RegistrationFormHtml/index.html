<!doctype html>
<html>
  <head>
    <title>Registration from</title>
  </head>
  <body>
    <header>
      <h1>Registration for Hospital Service</h1>
    </header>

    <main>
      <a href="https://www.bmu.ac.bd/" target="_main">
        <img src="pic.jpg" height="400"
      /></a>
      <form action="/action.php">
        <hr />
        <br />
        <h3>Enter Paitent Name</h3>
        <input type="text" placeholder="Paitent Name" />
        <br />
        <h3>Enter Paitent Contact Number</h3>
        <input type="text" placeholder="Paitent Contact " />

        <hr />
        <br />
        <h3>Paitent Male or Female</h3>
        <label for="101">
          <input type="radio" value="Male" name="Gender" id="101" />Male
        </label>
        <br />
        <label for="102">
          <input type="radio" value="Female" name="Gender" id="102" />female
        </label>

        <hr />
        <br />
        <h3>Identify Your Problem</h3>
        <label for="201">
          <input
            type="checkbox"
            value="Physical"
            name="Problem"
            id="201"
          />Physical
        </label>
        <br />
        <label for="202">
          <input type="checkbox" value="Mental" name="Problem" id="202" />Mental
        </label>
        <br />

        <label for="203">
          <input
            type="checkbox"
            value="Regular checkup"
            name="Problem"
            id="203"
          />Regular Checkup
        </label>
        <br />
        <hr />
        <textarea
          name="Feedback"
          id="301"
          placeholder="Describe Your Problem"
          rows="5"
        ></textarea>
        <hr />
        <br />
        <h3>Select Your Location</h3>
        <select>
          <option value="Inside Dhaka">Inside Dhaka</option>
          <option value="Outside Dhaka">Outside dhaka</option>
        </select>
        <hr />
        <br />

        <h3>FIRST AID KNOWLEDGE</h3>
        <iframe
          src="https://www.sja.org.uk/first-aid-advice/"
          height="400"
        ></iframe>
        <br />
        <h3>Click the Submit button</h3>
        <input type="submit" value="submit" />
      </form>
    </main>
    <footer>
      <hr />
      <pre><b>May Allah bless you!
            stay safe.
        </b></pre>
    </footer>
  </body>
</html>
